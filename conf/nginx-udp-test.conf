
worker_processes  1;

error_log  logs/error.log  debug;

events {
    worker_connections  1024;
}

stream {
    log_format basic '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time';

    access_log logs/stream-access.log basic;

    # DNS proxy for testing
    server {
        listen 127.0.0.1:5353 udp;
        proxy_pass 8.8.8.8:53;
        proxy_timeout 2s;
        proxy_responses 1;
    }

    # UDP echo/forward for testing
    server {
        listen 127.0.0.1:9999 udp;
        proxy_pass 127.0.0.1:9998;
        proxy_timeout 10s;
    }

    # Syslog server example
    server {
        listen 127.0.0.1:5514 udp;
        proxy_pass 127.0.0.1:514;
    }
}
