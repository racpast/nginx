name: Build nginx for Windows (MSVC)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  builddir: objs.msvc8
  pcre2_ver: 10.48
  zlib_ver: 1.3.2
  openssl_ver: 3.5.8

jobs:
  build:
    name: windows-2022, msvc, x86
    runs-on: windows-2022
    defaults:
      run:
        shell: C:\msys64\msys2_shell.cmd -defterm -no-start -where . -full-path -shell bash.exe -Eeo pipefail -x '{0}'

    steps:
      - name: Check out nginx sources
        uses: actions/checkout@v7

      - name: Set MSYSTEM
        run: |
          echo MSYSTEM=MINGW64 >> $GITHUB_ENV

      - name: Set up environment
        run: |
          echo "VCVARSALL=$('C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -products \* -latest -property installationPath)\\VC\\Auxiliary\\Build\\vcvarsall.bat" >> $GITHUB_ENV
          echo "VCARCH=x86" >> $GITHUB_ENV
          echo "CL=/MP" >> $GITHUB_ENV

          echo 'TEMP=C:\TEMP' >> $GITHUB_ENV
          echo 'TMP=C:\TEMP' >> $GITHUB_ENV
          echo 'TMPDIR=C:\TEMP' >> $GITHUB_ENV

          mkdir -p C:/TEMP/
          mkdir -p C:/tmp/
          mkdir -p ${{ env.builddir }}/lib

      - name: Check out and prepare PCRE2 sources
        run: |
          curl -sLO https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.pcre2_ver }}/pcre2-${{ env.pcre2_ver }}.tar.gz
          tar -C ${{ env.builddir }}/lib -xzf ./pcre2-${{ env.pcre2_ver }}.tar.gz
          echo '#include <stdint.h>' > ${{ env.builddir }}/lib/pcre2-${{ env.pcre2_ver }}/src/inttypes.h

      - name: Check out zlib sources
        run: |
          curl -sLO https://zlib.net/fossils/zlib-${{ env.zlib_ver }}.tar.gz \
            || curl -sLO https://github.com/madler/zlib/releases/download/v${{ env.zlib_ver }}/zlib-${{ env.zlib_ver }}.tar.gz
          tar -C ${{ env.builddir }}/lib -xzf ./zlib-${{ env.zlib_ver }}.tar.gz

      - name: Check out OpenSSL sources
        run: |
          curl -sLO https://github.com/openssl/openssl/releases/download/openssl-${{ env.openssl_ver }}/openssl-${{ env.openssl_ver }}.tar.gz
          tar -C ${{ env.builddir }}/lib -xzf ./openssl-${{ env.openssl_ver }}.tar.gz

      - name: Configure and build nginx
        shell: cmd
        run: |
          @echo on
          call "%VCVARSALL%" %VCARCH%
          bash.exe auto/configure ^
            --with-cc=cl ^
            --builddir=${{ env.builddir }} ^
            --with-debug ^
            --prefix= ^
            --conf-path=conf/nginx.conf ^
            --pid-path=logs/nginx.pid ^
            --http-log-path=logs/access.log ^
            --error-log-path=logs/error.log ^
            --sbin-path=nginx.exe ^
            --http-client-body-temp-path=temp/client_body_temp ^
            --http-proxy-temp-path=temp/proxy_temp ^
            --http-fastcgi-temp-path=temp/fastcgi_temp ^
            --http-scgi-temp-path=temp/scgi_temp ^
            --http-uwsgi-temp-path=temp/uwsgi_temp ^
            --with-cc-opt=-DFD_SETSIZE=1024 ^
            --with-pcre=${{ env.builddir }}/lib/pcre2-${{ env.pcre2_ver }} ^
            --with-zlib=${{ env.builddir }}/lib/zlib-${{ env.zlib_ver }} ^
            --with-http_v2_module ^
            --with-http_realip_module ^
            --with-http_addition_module ^
            --with-http_sub_module ^
            --with-http_dav_module ^
            --with-http_stub_status_module ^
            --with-http_flv_module ^
            --with-http_mp4_module ^
            --with-http_gunzip_module ^
            --with-http_gzip_static_module ^
            --with-http_auth_request_module ^
            --with-http_random_index_module ^
            --with-http_secure_link_module ^
            --with-http_slice_module ^
            --with-mail ^
            --with-stream ^
            --with-stream_realip_module ^
            --with-stream_ssl_preread_module ^
            --with-openssl=${{ env.builddir }}/lib/openssl-${{ env.openssl_ver }} ^
            --with-openssl-opt="no-asm no-tests no-makedepend -D_WIN32_WINNT=0x0501" ^
            --with-http_ssl_module ^
            --with-mail_ssl_module ^
            --with-stream_ssl_module
          nmake -f ${{ env.builddir }}/Makefile

      - name: Show nginx configuration
        shell: cmd
        run: |
          ${{ env.builddir }}\nginx.exe -V

      - name: Upload nginx binary
        uses: actions/upload-artifact@v7
        with:
          name: nginx-windows-msvc-x86
          path: ${{ env.builddir }}/nginx.exe
          if-no-files-found: error
